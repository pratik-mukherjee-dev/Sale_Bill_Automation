<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <style>
        :root {
            --bg-main: #f6f8fc;
            --panel: #ffffff;
            --border: #d7deea;
            --border-focus: #5b8def;
            --text-main: #1f2937;
            --text-secondary: #6b7280;
            --primary: #5b8def;
            --primary-hover: #4a7de0;
            --danger-soft: #fef2f2;
            --radius: 14px;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: var(--panel);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 420px;
            padding: 40px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .06);
            animation: fadeIn .4s ease;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header-icon {
            font-size: 36px;
            margin-bottom: 8px;
        }

        .header h1 {
            font-size: 20px;
            color: var(--text-main);
            margin: 0 0 4px;
        }

        .header p {
            font-size: 13px;
            color: var(--text-secondary);
            margin: 0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            background: #f9fbff;
            transition: .2s;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--border-focus);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(91, 141, 239, .15);
        }

        .error-box {
            background: var(--danger-soft);
            border: 1px solid #fecaca;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            color: #7f1d1d;
            margin-bottom: 18px;
        }

        .error-box ul {
            margin: 0;
            padding-left: 18px;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: .2s;
        }

        .submit-btn:hover {
            background: var(--primary-hover);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            color: var(--primary);
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

<div class="card">

    <div class="header">
        <div class="header-icon">🔑</div>
        <h1>Change Password</h1>
        <p>Enter your current password and choose a new one</p>
    </div>

    {% if form.errors %}
        <div class="error-box">
            <ul>
                {% for field in form %}
                    {% for error in field.errors %}
                        <li>{{ error }}</li>
                    {% endfor %}
                {% endfor %}
            </ul>
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label for="id_old_password">Current Password</label>
            <input type="password"
                   name="old_password"
                   id="id_old_password"
                   autofocus
                   autocomplete="current-password"
                   required>
        </div>

        <div class="form-group">
            <label for="id_new_password1">New Password</label>
            <input type="password"
                   name="new_password1"
                   id="id_new_password1"
                   autocomplete="new-password"
                   required>
        </div>

        <div class="form-group">
            <label for="id_new_password2">Confirm New Password</label>
            <input type="password"
                   name="new_password2"
                   id="id_new_password2"
                   autocomplete="new-password"
                   required>
        </div>

        <button type="submit" class="submit-btn">Update Password</button>
    </form>

    <a href="{% url 'home' %}" class="back-link">← Back to Dashboard</a>

</div>

</body>
</html>
