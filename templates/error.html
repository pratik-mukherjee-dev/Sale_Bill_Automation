<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Processing Failed</title>

    <style>

        :root {

            --bg-main: #f6f8fc;
            --panel: #ffffff;

            --border: #d7deea;

            --text-main: #1f2937;
            --text-secondary: #6b7280;

            --danger: #ef4444;
            --danger-soft: #fef2f2;

            --primary: #5b8def;
            --primary-hover: #4a7de0;

            --radius: 14px;
        }

        body {

            margin: 0;

            font-family: -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Roboto,
            sans-serif;

            background: radial-gradient(circle at 20% 10%, #ffeaea 0%, transparent 40%),
            radial-gradient(circle at 80% 90%, #fff1f1 0%, transparent 40%),
            var(--bg-main);

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .card {

            background: var(--panel);

            border-radius: var(--radius);

            border: 1px solid var(--border);

            width: 100%;
            max-width: 520px;

            padding: 40px;

            box-shadow: 0 8px 30px rgba(0, 0, 0, .06);

            text-align: center;

            animation: fadeIn .4s ease;
        }

        .error-badge {

            width: 80px;
            height: 80px;

            margin: 0 auto 20px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: linear-gradient(135deg, #ef4444, #f87171);

            color: white;

            font-size: 36px;

            box-shadow: 0 10px 20px rgba(239, 68, 68, .25);
        }

        h2 {

            margin: 0;

            font-size: 22px;

            color: var(--text-main);

            margin-bottom: 8px;
        }

        .subtitle {

            font-size: 14px;

            color: var(--text-secondary);

            margin-bottom: 25px;
        }

        /* Error box */

        .error-box {

            background: var(--danger-soft);

            border: 1px solid #fecaca;

            border-radius: 10px;

            padding: 14px;

            text-align: left;

            margin-bottom: 20px;

            font-size: 13px;

            color: #7f1d1d;

            white-space: pre-wrap;
        }

        /* Buttons */

        .button-group {

            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .primary-btn {

            padding: 10px 16px;

            border-radius: 8px;

            background: var(--primary);

            color: white;

            text-decoration: none;

            font-size: 13px;

            transition: .2s;
        }

        .primary-btn:hover {

            background: var(--primary-hover);
        }

        .secondary-btn {

            padding: 10px 16px;

            border-radius: 8px;

            background: white;

            border: 1px solid var(--border);

            color: var(--text-main);

            text-decoration: none;

            font-size: 13px;

            transition: .2s;
        }

        .secondary-btn:hover {

            background: #f3f4f6;
        }

        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

    </style>
</head>
<body>

<div class="card">

    <div class="error-badge">
        !
    </div>

    <h2>Processing Failed</h2>

    <div class="subtitle">
        An error occurred while processing your file.
    </div>


    {% if form_errors %}
        <div class="error-box">
            {{ form_errors }}
        </div>
    {% endif %}

    {% if non_field_errors %}
        <div class="error-box">
            {{ non_field_errors }}
        </div>
    {% endif %}


    <div class="button-group">

        <a href="{% url 'upload_file' %}"
           class="primary-btn">
            Try Again
        </a>

        <a href="{% url 'upload_file' %}"
           class="secondary-btn">
            Return to Upload
        </a>

    </div>

</div>

</body>
</html>
