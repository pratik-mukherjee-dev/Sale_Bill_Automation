<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        :root {
            --bg-main: #f6f8fc;
            --panel: #ffffff;
            --border: #d7deea;
            --border-focus: #5b8def;
            --text-main: #1f2937;
            --text-secondary: #6b7280;
            --primary: #5b8def;
            --primary-hover: #4a7de0;
            --danger: #ef4444;
            --danger-soft: #fef2f2;
            --radius: 14px;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at 30% 20%, #eaf1ff 0%, transparent 40%),
            radial-gradient(circle at 70% 80%, #eef2ff 0%, transparent 40%),
            var(--bg-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: var(--panel);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 400px;
            padding: 40px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .06);
            animation: fadeIn .4s ease;
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-icon {
            font-size: 40px;
            margin-bottom: 8px;
        }

        .brand h1 {
            font-size: 20px;
            color: var(--text-main);
            margin: 0 0 4px;
        }

        .brand p {
            font-size: 13px;
            color: var(--text-secondary);
            margin: 0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            background: #f9fbff;
            transition: .2s;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--border-focus);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(91, 141, 239, .15);
        }

        .error-box {
            background: var(--danger-soft);
            border: 1px solid #fecaca;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            color: #7f1d1d;
            margin-bottom: 18px;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: .2s;
        }

        .submit-btn:hover {
            background: var(--primary-hover);
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

<div class="card">

    <div class="brand">
        <div class="brand-icon">🔐</div>
        <h1>Automation Console</h1>
        <p>Sign in to continue</p>
    </div>

    {% if form.errors %}
        <div class="error-box">
            Invalid username or password. Please try again.
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label for="id_username">Username</label>
            <input type="text"
                   name="username"
                   id="id_username"
                   autofocus
                   autocomplete="username"
                   required>
        </div>

        <div class="form-group">
            <label for="id_password">Password</label>
            <input type="password"
                   name="password"
                   id="id_password"
                   autocomplete="current-password"
                   required>
        </div>

        <button type="submit" class="submit-btn">Sign In</button>
    </form>

    <div class="footer">
        Made with ❤️ by Byte-Force © 2026
    </div>

</div>

</body>
</html>
