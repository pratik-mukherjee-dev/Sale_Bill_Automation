<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Changed</title>
    <style>
        :root {
            --bg-main: #f6f8fc;
            --panel: #ffffff;
            --border: #d7deea;
            --text-main: #1f2937;
            --text-secondary: #6b7280;
            --primary: #5b8def;
            --primary-hover: #4a7de0;
            --success: #10b981;
            --radius: 14px;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at 20% 10%, #eaf1ff 0%, transparent 40%),
            radial-gradient(circle at 80% 90%, #ecfdf5 0%, transparent 40%),
            var(--bg-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: var(--panel);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 440px;
            padding: 40px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .06);
            text-align: center;
            animation: fadeIn .4s ease;
        }

        .success-badge {
            width: 72px;
            height: 72px;
            margin: 0 auto 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #10b981, #34d399);
            color: white;
            font-size: 32px;
            box-shadow: 0 10px 20px rgba(16, 185, 129, .25);
        }

        h2 {
            font-size: 22px;
            color: var(--text-main);
            margin: 0 0 8px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 26px;
        }

        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: .2s;
        }

        .back-btn:hover {
            background: var(--primary-hover);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

<div class="card">
    <div class="success-badge">✓</div>
    <h2>Password Updated</h2>
    <div class="subtitle">Your password has been changed successfully.</div>
    <a href="{% url 'home' %}" class="back-btn">← Back to Dashboard</a>
</div>

</body>
</html>
